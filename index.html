<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus Helpdesk - DDU Gorakhpur</title>
<style>
body{font-family:Arial;background:#f0f4ff;margin:0;padding:0}
header{background:#0a4a6e;color:white;padding:30px;text-align:center}
header h1{margin:0;font-size:28px}
header p{margin:5px 0 0;opacity:0.9}
.container{max-width:800px;margin:20px auto;padding:20px}
.card{background:white;padding:20px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);margin-bottom:20px}
input,textarea,select{width:100%;padding:10px;margin:8px 0;border:1px solid #ccc;border-radius:8px}
button{background:#0a4a6e;color:white;border:none;padding:12px 20px;border-radius:8px;cursor:pointer;width:100%;font-size:16px}
button:hover{background:#083a57}
.ticket{background:#eef2ff;padding:12px;border-radius:8px;margin-top:10px}
</style>
</head>
<body>
<header>
<h1>Deen Dayal Upadhyaya Gorakhpur University</h1>
<p>Campus Helpdesk - Student Support Portal</p>
<p>Gorakhpur, Uttar Pradesh</p>
</header>
<div class="container">
<div class="card">
<h2>Raise a Ticket 🎫</h2>
<input type="text" placeholder="Your Name">
<input type="text" placeholder="Roll Number / Course">
<select><option>Select Department</option><option>Exam Cell</option><option>Admission</option><option>Hostel</option><option>Fees / Scholarship</option><option>Other</option></select>
<textarea placeholder="Describe your problem..."></textarea>
<button>Submit Ticket</button>
</div>
<div class="card">
<h2>Recent Tickets</h2>
<div class="ticket"><b>Rahul - B.A 2nd Year</b><br>Exam form not opening</div>
<div class="ticket"><b>Priya - B.Sc</b><br>Scholarship status pending</div>
</div>
</div>
</body>
</html>
